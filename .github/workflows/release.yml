name: release

# Every push to main runs release-please, which only maintains a release PR.
# Nothing is built until that PR is merged: the merge is the deliberate
# "ship it" signal, and it alone marks a release created and gates the builds.
#
# A release is built by one job per platform. Each attaches its own downloads
# and hands over a fragment of the updater manifest; publish-manifest merges
# the fragments and attaches the one manifest installed apps poll. The
# manifest is the switch that offers a release to installed apps, so it is
# published last and only when every platform built.
#
# workflow_dispatch is a manual escape hatch: rebuild and re-attach an existing
# release tag without release-please. Use it when a release was cut but its
# build failed (e.g. a transient notarization network error) and the tag and
# GitHub release still exist, so re-running the push flow would skip the build.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to rebuild and attach (e.g. grapevine-v0.2.0)"
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

# Serialize runs: never cancel a release mid-build, but do not let two pushes
# race release-please into a conflicting release PR or a double tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    # release-please maintains the release PR and cuts releases; a manual
    # rebuild (workflow_dispatch) must not touch either, so skip it there.
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      # 'releases_created' (plural) is the aggregate flag for "any release was
      # cut this run". The tag is not exported here: its per-package output key
      # is namespaced by path and came back empty on an action re-run, silently
      # blanking the tag and breaking the upload. The build derives the tag
      # itself instead (see "Resolve the release tag").
      release_created: ${{ steps.release.outputs.releases_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-macos:
    needs: release-please
    # Build on a push only when release-please actually cut a release, or on any
    # manual rebuild. '!cancelled()' lets this run even though release-please is
    # skipped on a workflow_dispatch (a skipped dependency would otherwise skip
    # this job too).
    if: >-
      ${{ !cancelled()
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      ) }}
    runs-on: macos-latest
    outputs:
      updater: ${{ steps.signing.outputs.updater }}
    steps:
      # On a manual rebuild, check out the named tag; on a push, the default
      # ref (the commit that triggered the run).
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The release scripts come from the commit the workflow runs at, not
      # from the tag being rebuilt: a manual rebuild may name a tag cut before
      # they existed.
      - uses: actions/checkout@v5
        with:
          path: .release-tools
          sparse-checkout: .github/scripts

      - name: Resolve the release tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: .release-tools/.github/scripts/resolve-release-tag.sh

      # When the Apple secrets are absent (e.g. a fork), signing is skipped
      # rather than failing the release: the signing and verification steps
      # below gate on this flag, leaving an ordinary unsigned build.
      #
      # Notarization is detected separately: the cert alone signs the bundle,
      # but stapling and the Gatekeeper assessment only make sense once the
      # notary credentials are also present. A cert-only setup must not run
      # (and fail) the notarization checks.
      # The updater key is detected alongside: without it the build cannot sign
      # updater artifacts, so their creation is skipped entirely (again keeping
      # forks green) and installed apps simply never see this release offered.
      - name: Detect whether Apple signing is configured
        id: signing
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Apple signing secrets are not set; producing an unsigned build."
          fi

          if [ -n "$APPLE_ID" ] && [ -n "$APPLE_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
            echo "notarize=true" >> "$GITHUB_OUTPUT"
          else
            echo "notarize=false" >> "$GITHUB_OUTPUT"
            if [ -n "$APPLE_CERTIFICATE" ]; then
              echo "::warning::Notarization credentials are not set; producing a signed but un-notarized build."
            fi
          fi

          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; skipping updater artifacts, so installed apps will not auto-update to this release."
          fi

      # Import the Developer ID cert into a throwaway keychain scoped to this
      # runner. The keychain password is ephemeral, so it needs no secret; the
      # partition list is what lets codesign use the key without an interactive
      # unlock prompt. The signing identity is read back from the keychain
      # rather than hardcoded, so a cert renewal needs no workflow change.
      - name: Import the Apple Developer ID certificate
        if: steps.signing.outputs.enabled == 'true'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE" | base64 --decode > certificate.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          # No auto-lock timeout: the keychain must stay unlocked for the whole
          # build, and a notarization round-trip can outlast any fixed timeout,
          # which would relock it and break a later codesign call.
          security set-keychain-settings build.keychain
          security import certificate.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain
          rm certificate.p12
          IDENTITY="$(security find-identity -v -p codesigning build.keychain \
            | grep 'Developer ID Application' | head -1 | awk -F'"' '{print $2}')"
          echo "APPLE_SIGNING_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      # Universal so the download runs on both Apple silicon and Intel; a
      # native build would only ever match the runner's own architecture.
      # When APPLE_SIGNING_IDENTITY and the notarization credentials are set,
      # tauri signs the bundle and notarizes it with Apple, then staples the
      # ticket to the .app before it is zipped below. Absent those vars the
      # bundle falls back to an ad-hoc signature.
      # createUpdaterArtifacts lives in an overlay config merged in only here,
      # not in tauri.conf.json: with it enabled the bundler refuses to build
      # unless TAURI_SIGNING_PRIVATE_KEY is set, which would break every local
      # `tauri build`. With the overlay the build also emits Grapevine.app.tar.gz
      # plus a .sig made with the updater key, which installed apps verify
      # against the pubkey baked into tauri.conf.json.
      - name: Build the universal app bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ env.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          UPDATER: ${{ steps.signing.outputs.updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$UPDATER" = "true" ]; then
            npm run tauri build -- --target universal-apple-darwin \
              --config src-tauri/updater-artifacts.conf.json
          else
            npm run tauri build -- --target universal-apple-darwin
          fi

      # Fail the release if a build we believe is signed did not actually come
      # out signed and stapled: spctl assesses it exactly as Gatekeeper will on
      # a colleague's Mac, so a regression here is caught before we ship. The
      # Gatekeeper assessment and staple check only run when notarization was
      # configured; a signed-but-not-notarized build would fail them by design.
      - name: Verify the signature and notarization
        if: steps.signing.outputs.enabled == 'true'
        env:
          NOTARIZED: ${{ steps.signing.outputs.notarize }}
        run: |
          APP="src-tauri/target/universal-apple-darwin/release/bundle/macos/Grapevine.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          if [ "$NOTARIZED" = "true" ]; then
            spctl --assess -vvv --type exec "$APP"
            xcrun stapler validate "$APP"
          fi

      # ditto, not zip: it preserves the symlinks and metadata inside an .app
      # that a plain zip flattens, which corrupts the bundle on extraction.
      - name: Zip the app bundle
        run: |
          ditto -c -k --keepParent \
            "src-tauri/target/universal-apple-darwin/release/bundle/macos/Grapevine.app" \
            "Grapevine-v${VERSION}-universal.zip"

      # This job's share of the updater manifest. Both platform keys carry the
      # same universal tarball: the updater reports the arch it runs on, never
      # "universal". The tarball gets a versioned name so its per-release
      # download URL in the manifest can never collide across releases.
      - name: Write the updater manifest fragment
        if: steps.signing.outputs.updater == 'true'
        run: |
          BUNDLE_DIR="src-tauri/target/universal-apple-darwin/release/bundle/macos"
          TARBALL="Grapevine-v${VERSION}-universal.app.tar.gz"
          mv "$BUNDLE_DIR/Grapevine.app.tar.gz" "$TARBALL"
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${TARBALL}" \
            --rawfile signature "$BUNDLE_DIR/Grapevine.app.tar.gz.sig" \
            '{
              version: $version,
              platforms: {
                "darwin-aarch64": { signature: $signature, url: $url },
                "darwin-x86_64": { signature: $signature, url: $url }
              }
            }' > manifest-darwin.json

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: |
          ASSETS=("Grapevine-v${VERSION}-universal.zip")
          if [ "$UPDATER" = "true" ]; then
            ASSETS+=("Grapevine-v${VERSION}-universal.app.tar.gz")
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.updater == 'true'
        with:
          name: manifest-fragment-darwin
          path: manifest-darwin.json
          if-no-files-found: error

      # Notes come from CHANGELOG.md, not from what release-please derived for
      # the release body: the changelog is the copy a human may have rewritten
      # in the release PR, and this is what carries that rewrite onto the
      # release page. The install steps are appended from a static footer.
      - name: Set the release notes from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > notes.md

          # Never publish an empty release body: if the heading format ever
          # drifts from what this expects, keep the generated notes instead.
          if [ ! -s notes.md ]; then
            echo "::warning::No '$VERSION' section found in CHANGELOG.md; falling back to the generated notes."
            gh release view "$TAG" --json body -q .body > notes.md
          fi

          printf '\n' >> notes.md
          cat .github/release-footer.md >> notes.md
          gh release edit "$TAG" --notes-file notes.md

  build-linux:
    needs: release-please
    # Same gate as build-macos.
    if: >-
      ${{ !cancelled()
      && (
        (github.event_name == 'push' && needs.release-please.outputs.release_created == 'true')
        || github.event_name == 'workflow_dispatch'
      ) }}
    # One LTS behind current, so the .deb links against a glibc that current
    # Ubuntu also satisfies. Keep in step with test-ubuntu in ci.yml: the .deb
    # built there is the one CI proves installs on current Ubuntu.
    runs-on: ubuntu-24.04
    outputs:
      updater: ${{ steps.signing.outputs.updater }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || '' }}

      # Keep in step with the package list in ci.yml.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential pkg-config file \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libdbus-1-dev

      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # The release scripts come from the commit the workflow runs at, not
      # from the tag being rebuilt: a manual rebuild may name a tag cut before
      # they existed.
      - uses: actions/checkout@v5
        with:
          path: .release-tools
          sparse-checkout: .github/scripts

      - name: Resolve the release tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: .release-tools/.github/scripts/resolve-release-tag.sh

      # As in build-macos: without the updater key the .deb is still built and
      # attached, but carries no signature and joins no manifest.
      - name: Detect whether the updater key is configured
        id: signing
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "updater=true" >> "$GITHUB_OUTPUT"
          else
            echo "updater=false" >> "$GITHUB_OUTPUT"
            echo "::warning::TAURI_SIGNING_PRIVATE_KEY is not set; skipping the updater signature, so installed apps will not auto-update to this release."
          fi

      # The updater key is the only signature the .deb gets; it is not signed
      # as a package. With the overlay config the bundler writes a .sig next to
      # the .deb, which installed apps verify before installing it.
      - name: Build the .deb
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ "$UPDATER" = "true" ]; then
            npm run tauri build -- --bundles deb \
              --config src-tauri/updater-artifacts.conf.json
          else
            npm run tauri build -- --bundles deb
          fi

      # Versioned names, matching the macOS assets, so the download URL in the
      # manifest can never collide across releases. Exactly one .deb is
      # expected; more or fewer fails the job rather than shipping a guess.
      - name: Name the .deb for the release
        env:
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: |
          shopt -s nullglob
          DEBS=(src-tauri/target/release/bundle/deb/*.deb)
          if [ "${#DEBS[@]}" -ne 1 ]; then
            echo "::error::Expected one .deb, found ${#DEBS[@]}"
            exit 1
          fi
          DEB="Grapevine-v${VERSION}-amd64.deb"
          mv "${DEBS[0]}" "$DEB"
          if [ "$UPDATER" = "true" ]; then
            mv "${DEBS[0]}.sig" "$DEB.sig"
          fi
          echo "DEB=$DEB" >> "$GITHUB_ENV"

      - name: Write the updater manifest fragment
        if: steps.signing.outputs.updater == 'true'
        run: |
          jq -n \
            --arg version "$VERSION" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/${DEB}" \
            --rawfile signature "$DEB.sig" \
            '{
              version: $version,
              platforms: {
                "linux-x86_64-deb": { signature: $signature, url: $url }
              }
            }' > manifest-linux.json

      - name: Attach the build to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          UPDATER: ${{ steps.signing.outputs.updater }}
        run: |
          ASSETS=("$DEB")
          if [ "$UPDATER" = "true" ]; then
            ASSETS+=("$DEB.sig")
          fi
          gh release upload "$TAG" "${ASSETS[@]}" --clobber

      - uses: actions/upload-artifact@v7
        if: steps.signing.outputs.updater == 'true'
        with:
          name: manifest-fragment-linux
          path: manifest-linux.json
          if-no-files-found: error

  publish-manifest:
    needs: [build-macos, build-linux]
    # Both builds must have succeeded: a failed or skipped build publishes no
    # manifest, so releases/latest/download/latest.json has nothing new to
    # offer and installed apps stay on the release they run. The results are
    # checked by hand because '!cancelled()', needed for the same skipped
    # release-please reason as the builds, also switches off the default
    # "every dependency succeeded" rule.
    if: >-
      ${{ !cancelled()
      && needs.build-macos.result == 'success'
      && needs.build-linux.result == 'success'
      && needs.build-macos.outputs.updater == 'true'
      && needs.build-linux.outputs.updater == 'true' }}
    runs-on: ubuntu-latest
    steps:
      # Not the tag, even on a manual rebuild: this job only runs the release
      # scripts, and a rebuilt tag may have been cut before they existed.
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: "24"

      - name: Resolve the release tag
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: .github/scripts/resolve-release-tag.sh

      - uses: actions/download-artifact@v8
        with:
          pattern: manifest-fragment-*
          path: fragments
          merge-multiple: true

      # The script refuses to print a manifest that lacks a platform or mixes
      # versions, and the upload never runs after a failed merge.
      - name: Merge the fragments into the updater manifest
        run: |
          node scripts/merge-manifest.mjs \
            fragments/manifest-darwin.json fragments/manifest-linux.json \
            > latest.json

      # Installed apps poll this through the stable
      # releases/latest/download/latest.json URL.
      - name: Attach the manifest to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" latest.json --clobber
