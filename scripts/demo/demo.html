<!doctype html>
<!-- Stage for scripts/demo/demo.mjs: a fake desktop and menubar around the real
     popover, which runs unmodified in the iframe against a mocked backend. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grapevine demo stage</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1120px;
        height: 760px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        position: relative;
        background: linear-gradient(135deg, #3b2350 0%, #5a2f5f 45%, #7a3e5c 100%);
        color: #fff;
      }
      .menubar {
        position: absolute;
        inset: 0 0 auto 0;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        padding: 0 14px;
        background: rgba(246, 240, 248, 0.82);
        color: #1c1c1e;
        font-size: 13px;
      }
      .menubar-left {
        margin-right: auto;
        display: flex;
        gap: 18px;
      }
      .menubar-left b {
        font-weight: 700;
      }
      .tray {
        display: flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 7px;
        border-radius: 5px;
      }
      .tray.is-open {
        background: rgba(0, 0, 0, 0.12);
      }
      .tray img {
        height: 16px;
      }
      .tray-count {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .popover {
        position: absolute;
        top: 34px;
        right: 128px;
        width: 440px;
        height: 680px;
        border: 0;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.35),
          0 18px 50px rgba(0, 0, 0, 0.45);
        background: #f2f2f7;
      }
      .popover[hidden] {
        display: none;
      }
      .caption {
        position: absolute;
        left: 56px;
        top: 250px;
        width: 480px;
      }
      .caption-step {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 14px;
        color: #e8cfe6;
      }
      .caption-step kbd {
        font: inherit;
        font-weight: 600;
        padding: 2px 9px;
        border-radius: 6px;
        background: rgba(255, 255, 255, 0.16);
        color: #fff;
      }
      .caption h1 {
        margin-top: 16px;
        font-size: 34px;
        line-height: 1.15;
        font-weight: 700;
      }
      .caption p {
        margin-top: 12px;
        font-size: 17px;
        line-height: 1.45;
        color: #ead9ea;
      }
      .cursor {
        position: absolute;
        width: 22px;
        height: 22px;
        pointer-events: none;
        z-index: 10;
      }
      .cursor[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="menubar">
      <span class="menubar-left"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span></span>
      <span id="tray" class="tray"><img src="/src-tauri/icons/tray.png" alt="" /><span id="tray-count" class="tray-count"></span></span>
      <span>Wed 30 Sep 15:42</span>
    </div>
    <div class="caption">
      <div class="caption-step"><span id="step"></span><kbd id="key"></kbd></div>
      <h1 id="headline"></h1>
      <p id="detail"></p>
    </div>
    <iframe id="popover" class="popover" src="/index.html" hidden></iframe>
    <svg id="cursor" class="cursor" viewBox="0 0 24 24" hidden>
      <path d="M4 2 L4 19 L8.5 14.8 L11.6 21.6 L14.4 20.4 L11.3 13.7 L17.5 13.7 Z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" />
    </svg>
  </body>
</html>
