<!doctype html>
<!-- Stage for scripts/demo/demo.mjs: a fake desktop and menubar around the real
     popover, which runs in the iframe (popover.html) on the fake backend.
     demo.mjs labels the popover through window.callout. -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Grapevine demo stage</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1120px;
        height: 760px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      body {
        position: relative;
        background: linear-gradient(135deg, #3b2350 0%, #5a2f5f 45%, #7a3e5c 100%);
        color: #fff;
      }
      .menubar {
        position: absolute;
        inset: 0 0 auto 0;
        height: 28px;
        display: flex;
        align-items: center;
        justify-content: flex-end;
        gap: 18px;
        padding: 0 14px;
        background: rgba(246, 240, 248, 0.82);
        color: #1c1c1e;
        font-size: 13px;
      }
      .menubar-left {
        margin-right: auto;
        display: flex;
        gap: 18px;
      }
      .menubar-left b {
        font-weight: 700;
      }
      .tray {
        position: absolute;
        left: 742px;
        display: flex;
        align-items: center;
        gap: 4px;
        height: 22px;
        padding: 0 7px;
        border-radius: 5px;
      }
      .tray.is-open {
        background: rgba(0, 0, 0, 0.12);
      }
      .tray img {
        height: 16px;
      }
      .tray-count {
        font-size: 13px;
        font-variant-numeric: tabular-nums;
      }
      .popover {
        position: absolute;
        top: 34px;
        left: 360px;
        width: 440px;
        height: 680px;
        border: 0;
        border-radius: 10px;
        overflow: hidden;
        box-shadow:
          0 0 0 0.5px rgba(0, 0, 0, 0.35),
          0 18px 50px rgba(0, 0, 0, 0.45);
        background: #f2f2f7;
      }
      .popover[hidden] {
        display: none;
      }
      .hero {
        position: absolute;
        left: 40px;
        top: 486px;
        width: 290px;
      }
      .hero h1 {
        font-size: 30px;
        font-weight: 700;
        line-height: 1.1;
      }
      .hero p {
        margin-top: 10px;
        font-size: 16px;
        line-height: 1.4;
        color: #ead9ea;
      }
      .hero-os {
        margin-top: 16px;
        display: flex;
        gap: 8px;
      }
      .hero-os[hidden] {
        display: none;
      }
      .hero-os span {
        font-size: 13px;
        font-weight: 600;
        padding: 4px 11px;
        border-radius: 999px;
        background: #fff;
        color: #3b2350;
      }
      .ring {
        position: absolute;
        border: 2px solid #ff4d8d;
        border-radius: 7px;
        box-shadow: 0 0 0 3px rgba(255, 77, 141, 0.22);
        z-index: 20;
        pointer-events: none;
      }
      .chip {
        position: absolute;
        z-index: 21;
        white-space: nowrap;
        font-size: 15px;
        font-weight: 600;
        line-height: 1;
        padding: 8px 11px;
        border-radius: 8px;
        background: #fff;
        color: #1c1c1e;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
      }
      .lines {
        position: absolute;
        inset: 0;
        width: 1120px;
        height: 760px;
        z-index: 19;
        pointer-events: none;
      }
      .lines line {
        stroke: #ff4d8d;
        stroke-width: 1.5;
      }
      .cursor {
        position: absolute;
        width: 22px;
        height: 22px;
        pointer-events: none;
        z-index: 30;
      }
      .cursor[hidden] {
        display: none;
      }
    </style>
  </head>
  <body>
    <div class="menubar">
      <span class="menubar-left"><b>Finder</b><span>File</span><span>Edit</span><span>View</span><span>Go</span><span>Window</span><span>Help</span></span>
      <span id="tray" class="tray"><img src="/src-tauri/icons/tray.png" alt="" /><span id="tray-count" class="tray-count"></span></span>
      <span>Wed 30 Sep 15:42</span>
    </div>
    <div class="hero">
      <h1>Grapevine</h1>
      <p>Every pull request that needs you, one click from the menubar.</p>
      <div id="os" class="hero-os" hidden><span>macOS</span><span>Ubuntu</span></div>
    </div>
    <iframe id="popover" class="popover" src="/scripts/demo/popover.html" hidden></iframe>
    <svg id="cursor" class="cursor" viewBox="0 0 24 24" hidden>
      <path d="M4 2 L4 19 L8.5 14.8 L11.6 21.6 L14.4 20.4 L11.3 13.7 L17.5 13.7 Z" fill="#000" stroke="#fff" stroke-width="1.4" stroke-linejoin="round" />
    </svg>
    <svg id="lines" class="lines"></svg>
    <script>
      // Chips hang in the gutters either side of the popover (x 360 to 800).
      const GUTTER = { right: 826, left: 334 };
      // Ring `box` and join it by a line to a chip reading `text`. The chip
      // sits level with the ring unless `chipY` moves it clear of a neighbour.
      window.callout = (box, side, text, chipY) => {
        const pad = 4;
        const r = { x: box.x - pad, y: box.y - pad, w: box.width + pad * 2, h: box.height + pad * 2 };
        const ring = document.createElement("div");
        ring.className = "ring";
        Object.assign(ring.style, { left: `${r.x}px`, top: `${r.y}px`, width: `${r.w}px`, height: `${r.h}px` });
        const chip = document.createElement("div");
        chip.className = "chip";
        chip.textContent = text;
        document.body.append(ring, chip);
        const cy = chipY ?? r.y + r.h / 2;
        const cx = side === "right" ? GUTTER.right : GUTTER.left - chip.offsetWidth;
        Object.assign(chip.style, { left: `${cx}px`, top: `${cy - chip.offsetHeight / 2}px` });
        const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
        const ends = {
          x1: side === "right" ? cx : cx + chip.offsetWidth,
          y1: cy,
          x2: side === "right" ? r.x + r.w : r.x,
          y2: Math.min(Math.max(cy, r.y), r.y + r.h),
        };
        for (const [name, value] of Object.entries(ends)) line.setAttribute(name, value);
        document.getElementById("lines").append(line);
      };
    </script>
  </body>
</html>
